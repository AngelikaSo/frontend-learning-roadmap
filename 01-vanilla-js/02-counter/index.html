<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container">
      <div class="counter">
        <p class="count">0</p>
        <div class="container-btn">
          <button id="btnMinus" class="btn" data-action="decrease">-</button>
          <button id="btnReset" class="btn" data-action="reset">Reset</button>
          <button id="btnPlus" class="btn" data-action="increase">+</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
