<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="This is where your description goes" />
    <meta name="keywords" content="one, two, three" />

    <title>Tea Selector</title>

    <!-- external CSS link -->
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>What Tea Should I Drink?</h1>
    <form action="" class="form-1">
      <p>How are you feeling?</p>
      <input
        type="radio"
        id="tired"
        name="feeling"
        value="tired"
        class="checked"
      />
      <label for="tired">😴 Tired</label>
      <input
        type="radio"
        id="energy"
        name="feeling"
        value="energy"
        class="checked"
      />
      <label for="energy">⚡️ Need energy</label>
      <input
        type="radio"
        id="relax"
        name="feeling"
        value="relax"
        class="checked"
      />
      <label for="relax">😌 Want to relax</label>
      <input
        type="radio"
        id="focus"
        name="feeling"
        value="focus"
        class="checked"
      />
      <label for="focus">🧠 Need to focus</label>
    </form>
    <form action="" class="form-2">
      <p>What flavor?</p>
      <input
        type="radio"
        id="floral"
        name="flavor"
        value="floral"
        class="checked"
      />
      <label for="floral">🌸 Floral</label>
      <input
        type="radio"
        id="fresh"
        name="flavor"
        value="fresh"
        class="checked"
      />
      <label for="fresh">🍋 Fresh</label>
      <input
        type="radio"
        id="sweet"
        name="flavor"
        value="sweet"
        class="checked"
      />
      <label for="sweet">🍯 Sweet</label>
      <input
        type="radio"
        id="earthy"
        name="flavor"
        value="earthy"
        class="checked"
      />
      <label for="earthy">🍃 Earthy</label>
    </form>
    <button id="select-tea">CHOOSE TEA</button>
    <h3 id="display"></h3>
    <script type="text/javascript" src="js/main.js"></script>
  </body>
</html>
